{% extends 'base.html' %}
{% block content %}
<div class="container" style="max-width: 520px; min-height: 80vh; display: flex; align-items: center; justify-content: center;">
    <div class="glass-card reveal" style="width: 100%; border: 1px solid var(--glass-border-bright); background: rgba(11, 26, 16, 0.88);">
        <!-- Header -->
        <div class="text-center mb-2">
            <div style="width: 54px; height: 54px; border-radius: 16px; background: rgba(16, 185, 129, 0.15); border: 1px solid var(--primary); display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem auto; font-size: 1.5rem; color: var(--primary-light);">
                🌱
            </div>
            <h2 style="margin: 0; font-size: 2rem;">Farmer Login</h2>
            <p class="card-desc" style="margin-top: 0.35rem;">Access your agricultural dashboard & IoT nodes</p>
        </div>
        
        <form method="POST">
            <div class="form-group">
                <label>Email or Registered Mobile Number</label>
                <input type="text" name="contact" required placeholder="demo@smartkrishi.in" value="demo@smartkrishi.in">
            </div>
            <div class="form-group">
                <label>Access Password</label>
                <input type="password" name="password" required placeholder="demo123" value="demo123">
            </div>
            
            <button type="submit" class="btn btn-primary btn-shimmer" style="width: 100%; padding: 0.95rem; font-size: 1rem; margin-top: 0.5rem; justify-content: center;">
                <span>Sign In to Dashboard →</span>
            </button>
        </form>

        <div style="margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid rgba(255, 255, 255, 0.08); text-align: center;">
            <p class="card-desc" style="margin: 0;">
                New farmer joining Smart Krishi? 
                <a href="/register" style="color: var(--primary-light); text-decoration: none; font-weight: 700; margin-left: 0.25rem;">
                    Create Free Account
                </a>
            </p>
            <p class="card-desc" style="font-size: 0.78rem; margin-top: 0.5rem; color: var(--text-dim);">
                Demo credentials pre-filled for immediate exploration
            </p>
        </div>
    </div>
</div>
{% endblock %}
